name: Check upstream releases

on:
  schedule:
    # 04:17 UTC every Wednesday.
    - cron: '17 4 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-upstream:
    name: Check upstream releases
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          submodules: recursive

      - name: Update submodules to latest stable upstream tags
        id: update
        run: ./scripts/update-upstream-tags.sh

      - name: Commit upstream updates to main
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update upstream static binary sources"
          git pull --rebase origin main
          git push origin HEAD:main
